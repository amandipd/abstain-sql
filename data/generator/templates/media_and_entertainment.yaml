# Schema templates for the media and entertainment family (plan step 1.2).
#
# One template per topic in families.yaml. Each lists a pool of tables; the
# generator samples 3-8 linked tables per schema and picks among the synonyms.
# The format is documented in data/generator/schemas.py.

topics:

  music industry:
    tables:
      - key: artists
        names: [artists, performers]
        id: [artist_id, performer_id]
        columns:
          - {names: [name, stage_name], type: text, role: entity_name, kind: music artist}
          - {names: [genre, primary_genre], type: text, role: category, values: [pop, hip-hop, rock, country, R&B, electronic, Latin, indie, jazz, classical]}
          - {names: [home_country, origin_country], type: text, role: category, values: [United States, United Kingdom, Canada, Sweden, South Korea, Nigeria, Brazil, Australia, Germany, Mexico]}
          - {names: [debut_date, first_release_date], type: date, role: date, min: "1990-01-01", max: "2024-12-31"}
          - {names: [monthly_listeners], type: integer, role: number, min: 1000, max: 80000000, optional: true}
          - {names: [is_solo, solo_act], type: integer, role: flag, optional: true}

      - key: record_labels
        names: [record_labels, labels]
        id: [record_label_id, label_id]
        columns:
          - {names: [name], type: text, role: entity_name, kind: record label}
          - {names: [label_tier, ownership], type: text, role: category, values: [major, major-owned imprint, independent, artist-owned]}
          - {names: [founded_year, year_founded], type: integer, role: number, min: 1950, max: 2022}
          - {names: [roster_size, artist_count], type: integer, role: number, min: 3, max: 400, optional: true}

      - key: record_deals
        names: [record_deals, contracts]
        id: [deal_id, contract_id]
        columns:
          - {role: fk, ref: artists, type: integer}
          - {role: fk, ref: record_labels, type: integer}
          - {names: [signed_date, signing_date], type: date, role: date, min: "2010-01-01", max: "2025-12-31"}
          - {names: [agreement_type], type: text, role: category, values: [standard, distribution, licensing, "360 deal", joint venture]}
          - {names: [advance_amount, advance], type: real, role: number, min: 5000, max: 5000000}
          - {names: [royalty_rate], type: real, role: number, min: 0.10, max: 0.30}
          - {names: [term_years], type: integer, role: number, min: 1, max: 7, optional: true}

      - key: albums
        names: [albums, releases]
        id: [album_id, release_id]
        columns:
          - {role: fk, ref: artists, type: integer}
          - {names: [title], type: text, role: entity_name, kind: album}
          - {names: [release_date], type: date, role: date, min: "2010-01-01", max: "2025-12-31"}
          - {names: [record_type, project_type], type: text, role: category, values: [studio album, EP, live album, compilation, soundtrack]}
          - {names: [track_count, number_of_tracks], type: integer, role: number, min: 4, max: 24}
          - {names: [production_budget, recording_budget], type: real, role: number, min: 2000, max: 1500000, optional: true}

      - key: tracks
        names: [tracks, songs]
        id: [track_id, song_id]
        columns:
          - {role: fk, ref: albums, type: integer}
          - {names: [title], type: text, role: entity_name, kind: song}
          - {names: [duration_seconds, runtime_seconds], type: integer, role: number, min: 90, max: 480}
          - {names: [is_explicit, explicit_lyrics], type: integer, role: flag}
          - {names: [tempo_bpm, bpm], type: integer, role: number, min: 60, max: 180, optional: true}
          - {names: [is_single, released_as_single], type: integer, role: flag, optional: true}

      - key: streaming_platforms
        names: [streaming_platforms, services]
        id: [platform_id, service_id]
        columns:
          - {names: [name], type: text, role: entity_name, kind: streaming platform}
          - {names: [business_model], type: text, role: category, values: [subscription, ad-supported, freemium, download store, video]}
          - {names: [payout_per_stream, per_stream_rate], type: real, role: number, min: 0.001, max: 0.012}
          - {names: [launch_year, year_launched], type: integer, role: number, min: 2003, max: 2022, optional: true}

      - key: monthly_streams
        names: [monthly_streams, stream_counts]
        id: [stream_record_id, count_id]
        columns:
          - {role: fk, ref: tracks, type: integer}
          - {role: fk, ref: streaming_platforms, type: integer}
          - {names: [period_start, month_start], type: date, role: date, min: "2018-01-01", max: "2025-12-01"}
          - {names: [stream_count, plays], type: integer, role: number, min: 0, max: 50000000}
          - {names: [payout, payout_amount], type: real, role: number, min: 0, max: 250000}
          - {names: [listener_market, market], type: text, role: category, values: [North America, Latin America, Europe, Asia Pacific, Africa, Middle East], optional: true}

      - key: royalty_payments
        names: [royalty_payments, royalties]
        id: [payment_id, royalty_id]
        columns:
          - {role: fk, ref: artists, type: integer}
          - {names: [payment_date, paid_on], type: date, role: date, min: "2018-01-01", max: "2025-12-31"}
          - {names: [amount, gross_amount], type: real, role: number, min: 50, max: 900000}
          - {names: [income_source, revenue_source], type: text, role: category, values: [streaming, radio airplay, sync licensing, physical sales, performance rights, digital downloads]}

      - key: songwriters
        names: [songwriters, composers]
        id: [songwriter_id, composer_id]
        columns:
          - {names: [first_name], type: text, role: first_name}
          - {names: [last_name], type: text, role: last_name}
          - {names: [rights_society, pro_affiliation], type: text, role: category, values: [ASCAP, BMI, SESAC, PRS, SOCAN, GEMA]}
          - {names: [career_start_date, active_since], type: date, role: date, min: "1980-01-01", max: "2024-12-31"}
          - {names: [is_also_performer], type: integer, role: flag, optional: true}

      - key: writing_credits
        names: [writing_credits, songwriting_splits]
        id: [credit_id, split_id]
        columns:
          - {role: fk, ref: tracks, type: integer}
          - {role: fk, ref: songwriters, type: integer}
          - {names: [share_percent, ownership_share], type: real, role: number, min: 5, max: 100}
          - {names: [contribution], type: text, role: category, values: [lyrics, music, lyrics and music, production, arrangement]}

      - key: radio_spins
        names: [radio_spins, airplay]
        id: [spin_id, airplay_id]
        columns:
          - {role: fk, ref: tracks, type: integer}
          - {names: [week_start, play_week], type: date, role: date, min: "2018-01-01", max: "2025-12-31"}
          - {names: [station_format], type: text, role: category, values: [top 40, rock, country, urban, adult contemporary, alternative, Latin]}
          - {names: [spin_count, spins], type: integer, role: number, min: 1, max: 900}
          - {names: [audience_millions, estimated_audience_millions], type: real, role: number, min: 0.05, max: 60}

      - key: chart_entries
        names: [chart_entries, chart_positions]
        id: [entry_id, position_id]
        columns:
          - {role: fk, ref: tracks, type: integer}
          - {names: [chart_week, week_ending], type: date, role: date, min: "2018-01-01", max: "2025-12-31"}
          - {names: [chart_name], type: text, role: category, values: [overall singles, streaming songs, radio songs, digital sales, viral]}
          - {names: [chart_position, placement], type: integer, role: number, min: 1, max: 100}
          - {names: [weeks_on_chart], type: integer, role: number, min: 1, max: 80}
          - {names: [chart_points], type: real, role: number, min: 1000, max: 250000, optional: true}

  concerts and festivals:
    tables:
      - key: venues
        names: [venues]
        id: [venue_id]
        columns:
          - {names: [name], type: text, role: entity_name, kind: venue}
          - {names: [city], type: text, role: category, values: [Chicago, Austin, Nashville, Los Angeles, Atlanta, Seattle, Toronto, London, Berlin, Melbourne]}
          - {names: [capacity, max_capacity], type: integer, role: number, min: 200, max: 80000}
          - {names: [venue_type, setting], type: text, role: category, values: [arena, stadium, theater, club, amphitheater, outdoor park]}
          - {names: [rental_fee, nightly_rental], type: real, role: number, min: 1500, max: 400000, optional: true}

      - key: performers
        names: [performers, acts]
        id: [performer_id, act_id]
        columns:
          - {names: [name], type: text, role: entity_name, kind: music artist}
          - {names: [genre], type: text, role: category, values: [rock, pop, hip-hop, electronic, country, indie, metal, jazz, folk, R&B]}
          - {names: [booking_fee, standard_fee], type: real, role: number, min: 2000, max: 3000000}
          - {names: [member_count, lineup_size], type: integer, role: number, min: 1, max: 9, optional: true}
          - {names: [is_touring, currently_touring], type: integer, role: flag, optional: true}

      - key: concerts
        names: [concerts, shows]
        id: [concert_id, show_id]
        columns:
          - {role: fk, ref: venues, type: integer}
          - {names: [performance_date, start_date], type: date, role: date, min: "2016-01-01", max: "2025-12-31"}
          - {names: [base_ticket_price, face_value], type: real, role: number, min: 15, max: 450}
          - {names: [attendance, paid_attendance], type: integer, role: number, min: 50, max: 80000}
          - {names: [is_sold_out, sold_out], type: integer, role: flag, optional: true}

      - key: lineup_slots
        names: [lineup_slots, bookings]
        id: [slot_id, booking_id]
        columns:
          - {role: fk, ref: concerts, type: integer}
          - {role: fk, ref: performers, type: integer}
          - {names: [is_headliner, headliner], type: integer, role: flag}
          - {names: [performance_fee, guarantee], type: real, role: number, min: 500, max: 3000000}
          - {names: [set_minutes, set_length_minutes], type: integer, role: number, min: 20, max: 180}
          - {names: [billing_slot, slot_number], type: integer, role: number, min: 1, max: 6, optional: true}

      - key: fans
        names: [fans, ticket_buyers]
        id: [fan_id, buyer_id]
        columns:
          - {names: [first_name], type: text, role: first_name}
          - {names: [last_name], type: text, role: last_name}
          - {names: [birth_date], type: date, role: date, min: "1950-01-01", max: "2008-12-31"}
          - {names: [home_city], type: text, role: category, values: [Chicago, Austin, Nashville, Los Angeles, Atlanta, Seattle, Toronto, London, Berlin, Melbourne]}
          - {names: [signup_date, account_created], type: date, role: date, min: "2014-01-01", max: "2025-12-31", optional: true}
          - {names: [is_vip_member], type: integer, role: flag, optional: true}

      - key: tickets
        names: [tickets]
        id: [ticket_id]
        columns:
          - {role: fk, ref: concerts, type: integer}
          - {role: fk, ref: fans, type: integer}
          - {names: [purchase_date, bought_on], type: date, role: date, min: "2015-06-01", max: "2025-12-31"}
          - {names: [price_paid, ticket_price], type: real, role: number, min: 15, max: 1200}
          - {names: [seat_section, section], type: text, role: category, values: [floor, lower bowl, upper bowl, balcony, general admission, VIP box]}
          - {names: [sales_channel, purchase_channel], type: text, role: category, values: [primary online, box office, resale, presale, complimentary]}
          - {names: [was_scanned, attended], type: integer, role: flag, optional: true}

      - key: festivals
        names: [festivals]
        id: [festival_id]
        columns:
          - {role: fk, ref: venues, type: integer}
          - {names: [name], type: text, role: entity_name, kind: festival}
          - {names: [main_genre, genre_focus], type: text, role: category, values: [rock, electronic, hip-hop, country, jazz, folk, multi-genre, indie]}
          - {names: [first_held_year, inaugural_year], type: integer, role: number, min: 1970, max: 2022}
          - {names: [has_camping, camping_available], type: integer, role: flag, optional: true}

      - key: festival_editions
        names: [festival_editions, editions]
        id: [festival_edition_id, edition_id]
        columns:
          - {role: fk, ref: festivals, type: integer}
          - {names: [start_date, opening_date], type: date, role: date, min: "2015-01-01", max: "2025-12-31"}
          - {names: [duration_days, run_days], type: integer, role: number, min: 1, max: 5}
          - {names: [attendance, total_attendance], type: integer, role: number, min: 2000, max: 400000}
          - {names: [gross_revenue, revenue], type: real, role: number, min: 100000, max: 250000000}
          - {names: [had_weather_delay, weather_disruption], type: integer, role: flag, optional: true}

      - key: festival_sets
        names: [festival_sets, festival_performances]
        id: [set_id, performance_id]
        columns:
          - {role: fk, ref: festival_editions, type: integer}
          - {role: fk, ref: performers, type: integer}
          - {names: [stage, stage_area], type: text, role: category, values: [main stage, second stage, tent, dance arena, acoustic stage]}
          - {names: [festival_day, day_number], type: integer, role: number, min: 1, max: 5}
          - {names: [set_minutes, set_length_minutes], type: integer, role: number, min: 30, max: 120}
          - {names: [performance_fee, guarantee], type: real, role: number, min: 1000, max: 4000000}

      - key: sponsorships
        names: [sponsorships, sponsor_deals]
        id: [sponsorship_id, deal_id]
        columns:
          - {role: fk, ref: festivals, type: integer}
          - {names: [sponsor, sponsor_name], type: text, role: entity_name, kind: company}
          - {names: [sponsor_tier, tier], type: text, role: category, values: [title, presenting, platinum, gold, silver]}
          - {names: [deal_value, amount], type: real, role: number, min: 10000, max: 8000000}
          - {names: [signed_date, signing_date], type: date, role: date, min: "2015-01-01", max: "2025-12-31"}

      - key: settlements
        names: [settlements, show_settlements]
        id: [settlement_id, show_settlement_id]
        columns:
          - {role: fk, ref: concerts, type: integer}
          - {names: [settled_on, settlement_date], type: date, role: date, min: "2016-01-01", max: "2025-12-31"}
          - {names: [gross_receipts, gross_ticket_sales], type: real, role: number, min: 2000, max: 20000000}
          - {names: [show_expenses, operating_costs], type: real, role: number, min: 1000, max: 6000000}
          - {names: [promoter_share_pct, promoter_split], type: real, role: number, min: 5, max: 20, optional: true}

      - key: merch_sales
        names: [merch_sales, merchandise_sales]
        id: [merch_sale_id, sale_id]
        columns:
          - {role: fk, ref: concerts, type: integer}
          - {names: [item_type, product], type: text, role: category, values: [t-shirt, hoodie, poster, hat, vinyl record, tote bag]}
          - {names: [units_sold, quantity], type: integer, role: number, min: 1, max: 5000}
          - {names: [revenue, gross_sales], type: real, role: number, min: 20, max: 300000}

  entertainment industry:
    tables:
      - key: studios
        names: [studios, production_companies]
        id: [studio_id, company_id]
        columns:
          - {names: [name], type: text, role: entity_name, kind: studio}
          - {names: [ownership, ownership_type], type: text, role: category, values: [major, mini-major, independent, streamer-owned, broadcaster-owned]}
          - {names: [headquarters_city, base_city], type: text, role: category, values: [Los Angeles, New York, London, Toronto, Atlanta, Vancouver, Mumbai, Seoul]}
          - {names: [founded_year, year_founded], type: integer, role: number, min: 1912, max: 2022}
          - {names: [annual_slate_budget, yearly_budget], type: real, role: number, min: 5000000, max: 3000000000, optional: true}

      - key: productions
        names: [productions, projects]
        id: [production_id, project_id]
        columns:
          - {role: fk, ref: studios, type: integer}
          - {names: [title, working_title], type: text, role: entity_name, kind: film}
          - {names: [content_type, medium], type: text, role: category, values: [feature film, TV series, limited series, documentary, TV movie, animated feature]}
          - {names: [genre], type: text, role: category, values: [drama, comedy, action, thriller, horror, science fiction, romance, family]}
          - {names: [budget, approved_budget], type: real, role: number, min: 200000, max: 300000000}
          - {names: [greenlight_date, approved_on], type: date, role: date, min: "2012-01-01", max: "2025-12-31"}
          - {names: [runtime_minutes], type: integer, role: number, min: 22, max: 200, optional: true}

      - key: people
        names: [people, talent]
        id: [person_id, talent_id]
        columns:
          - {names: [first_name], type: text, role: first_name}
          - {names: [last_name], type: text, role: last_name}
          - {names: [birth_date, date_of_birth], type: date, role: date, min: "1940-01-01", max: "2010-12-31"}
          - {names: [primary_craft, profession], type: text, role: category, values: [actor, director, writer, producer, cinematographer, composer, editor]}
          - {names: [is_guild_member, union_member], type: integer, role: flag, optional: true}

      - key: credits
        names: [credits, screen_credits]
        id: [credit_id, screen_credit_id]
        columns:
          - {role: fk, ref: productions, type: integer}
          - {role: fk, ref: people, type: integer}
          - {names: [credit_type, job], type: text, role: category, values: [lead actor, supporting actor, guest star, director, writer, producer, composer]}
          - {names: [fee, compensation], type: real, role: number, min: 5000, max: 30000000}
          - {names: [billing_slot, billing_number], type: integer, role: number, min: 1, max: 40, optional: true}
          - {names: [days_on_set, work_days], type: integer, role: number, min: 1, max: 120, optional: true}

      - key: distributors
        names: [distributors]
        id: [distributor_id]
        columns:
          - {names: [name], type: text, role: entity_name, kind: film distributor}
          - {names: [channel, distribution_channel], type: text, role: category, values: [theatrical, streaming, broadcast TV, cable, home video]}
          - {names: [market_share_pct, market_share], type: real, role: number, min: 0.1, max: 25, optional: true}

      - key: releases
        names: [releases]
        id: [release_id]
        columns:
          - {role: fk, ref: productions, type: integer}
          - {role: fk, ref: distributors, type: integer}
          - {names: [release_date, premiere_date], type: date, role: date, min: "2015-01-01", max: "2025-12-31"}
          - {names: [territory, market], type: text, role: category, values: [United States, United Kingdom, France, Germany, Japan, South Korea, Brazil, India, Australia, Mexico]}
          - {names: [release_channel, release_type], type: text, role: category, values: [theatrical, streaming, broadcast, home video, festival premiere]}
          - {names: [opening_screens, screen_count], type: integer, role: number, min: 0, max: 4500, optional: true}
          - {names: [marketing_spend, ad_spend], type: real, role: number, min: 50000, max: 150000000, optional: true}

      - key: box_office
        names: [box_office_weekends, weekend_grosses]
        id: [weekend_id, gross_id]
        columns:
          - {role: fk, ref: releases, type: integer}
          - {names: [weekend_start, weekend_date], type: date, role: date, min: "2015-01-01", max: "2025-12-31"}
          - {names: [gross, weekend_gross], type: real, role: number, min: 1000, max: 250000000}
          - {names: [theater_count, theaters], type: integer, role: number, min: 1, max: 4600}
          - {names: [weeks_in_release, week_number], type: integer, role: number, min: 1, max: 30}

      - key: episodes
        names: [episodes]
        id: [episode_id]
        columns:
          - {role: fk, ref: productions, type: integer}
          - {names: [season_number, season], type: integer, role: number, min: 1, max: 12}
          - {names: [episode_number], type: integer, role: number, min: 1, max: 24}
          - {names: [air_date, first_aired], type: date, role: date, min: "2012-01-01", max: "2025-12-31"}
          - {names: [viewers_millions, audience_millions], type: real, role: number, min: 0.1, max: 25}
          - {names: [episode_budget, cost], type: real, role: number, min: 500000, max: 20000000, optional: true}

      - key: nominations
        names: [award_nominations, nominations]
        id: [award_nomination_id, nomination_id]
        columns:
          - {role: fk, ref: productions, type: integer}
          - {names: [award_category, category], type: text, role: category, values: [best picture, best director, best lead performance, best supporting performance, best screenplay, best original score, best drama series, best comedy series]}
          - {names: [awarding_body, ceremony], type: text, role: category, values: [national film academy, television academy, critics circle, international festival jury, guild awards]}
          - {names: [ceremony_date, announced_on], type: date, role: date, min: "2015-01-01", max: "2025-12-31"}
          - {names: [is_winner, won], type: integer, role: flag}

      - key: filming_locations
        names: [filming_locations, shoot_locations]
        id: [location_id, shoot_location_id]
        columns:
          - {role: fk, ref: productions, type: integer}
          - {names: [city, shoot_city], type: text, role: category, values: [Atlanta, Vancouver, Toronto, Albuquerque, London, Budapest, Prague, Sydney, Wellington, Los Angeles]}
          - {names: [start_date, shoot_start], type: date, role: date, min: "2012-01-01", max: "2025-12-31"}
          - {names: [shoot_days, days_on_location], type: integer, role: number, min: 1, max: 90}
          - {names: [location_cost, local_spend], type: real, role: number, min: 10000, max: 60000000}
          - {names: [tax_incentive_rate, incentive_rate], type: real, role: number, min: 0, max: 0.40, optional: true}

      - key: licensing_deals
        names: [licensing_deals, license_agreements]
        id: [deal_id, agreement_id]
        columns:
          - {role: fk, ref: productions, type: integer}
          - {role: fk, ref: distributors, type: integer}
          - {names: [signed_date, executed_on], type: date, role: date, min: "2015-01-01", max: "2025-12-31"}
          - {names: [license_fee, fee], type: real, role: number, min: 50000, max: 200000000}
          - {names: [term_months, license_months], type: integer, role: number, min: 6, max: 120}
          - {names: [is_exclusive, exclusive_rights], type: integer, role: flag}

      - key: critic_reviews
        names: [critic_reviews, reviews]
        id: [critic_review_id, review_id]
        columns:
          - {role: fk, ref: productions, type: integer}
          - {names: [review_date, published_on], type: date, role: date, min: "2012-01-01", max: "2025-12-31"}
          - {names: [score, critic_score], type: real, role: number, min: 0, max: 100}
          - {names: [outlet_type, publication_type], type: text, role: category, values: [newspaper, magazine, website, podcast, broadcast]}
          - {names: [is_top_critic], type: integer, role: flag, optional: true}

  gaming industry:
    tables:
      - key: developers
        names: [developers, game_studios]
        id: [developer_id, studio_id]
        columns:
          - {names: [name], type: text, role: entity_name, kind: game studio}
          - {names: [home_country, headquarters_country], type: text, role: category, values: [United States, Japan, Canada, Sweden, Poland, South Korea, China, France, United Kingdom, Finland]}
          - {names: [founded_year, year_founded], type: integer, role: number, min: 1975, max: 2022}
          - {names: [headcount, employee_count], type: integer, role: number, min: 5, max: 9000}
          - {names: [is_indie, independent], type: integer, role: flag, optional: true}

      - key: games
        names: [games]
        id: [game_id]
