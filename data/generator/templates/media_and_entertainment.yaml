          - {names: [binding, product_form], type: text, role: category, values: [hardcover, trade paperback, mass market paperback, ebook, audiobook, large print]}
          - {names: [release_date, on_sale_date], type: date, role: date, min: "2005-01-01", max: "2025-12-31"}
          - {names: [list_price, retail_price], type: real, role: number, min: 2.99, max: 60}
          - {names: [is_first_edition], type: integer, role: flag, optional: true}

      - key: retailers
        names: [retailers, sales_channels]
        id: [retailer_id, channel_id]
        columns:
          - {names: [name], type: text, role: entity_name, kind: bookstore}
          - {names: [business_type, store_type], type: text, role: category, values: [independent bookstore, bookstore chain, online store, big-box store, library wholesaler, airport shop]}
          - {names: [discount_rate, trade_discount], type: real, role: number, min: 0.35, max: 0.55}

      - key: sales
        names: [monthly_sales, sales_reports]
        id: [sale_record_id, report_id]
        columns:
          - {role: fk, ref: editions, type: integer}
          - {role: fk, ref: retailers, type: integer}
          - {names: [period_start, month_start], type: date, role: date, min: "2015-01-01", max: "2025-12-01"}
          - {names: [units_sold, copies_sold], type: integer, role: number, min: 0, max: 60000}
          - {names: [net_revenue, revenue], type: real, role: number, min: 0, max: 900000}

      - key: royalty_statements
        names: [royalty_statements, royalty_payments]
        id: [statement_id, payment_id]
        columns:
          - {role: fk, ref: authors, type: integer}
          - {names: [statement_date, period_end], type: date, role: date, min: "2015-01-01", max: "2025-12-31"}
          - {names: [amount_paid, royalty_amount], type: real, role: number, min: 0, max: 500000}
          - {names: [units_reported, copies_counted], type: integer, role: number, min: 0, max: 200000}

      - key: contracts
        names: [book_contracts, publishing_contracts]
        id: [book_contract_id, publishing_contract_id]
        columns:
          - {role: fk, ref: authors, type: integer}
          - {role: fk, ref: publishers, type: integer}
          - {role: fk, ref: literary_agents, type: integer}
          - {names: [signed_date, signing_date], type: date, role: date, min: "2010-01-01", max: "2025-12-31"}
          - {names: [advance, advance_amount], type: real, role: number, min: 1000, max: 5000000}
          - {names: [royalty_rate], type: real, role: number, min: 0.05, max: 0.25}
          - {names: [title_count], type: integer, role: number, min: 1, max: 4}
          - {names: [rights_scope, territory], type: text, role: category, values: [world, world English, North America, UK and Commonwealth], optional: true}

      - key: foreign_rights
        names: [foreign_rights, translation_rights]
        id: [foreign_rights_id, translation_rights_id]
        columns:
          - {role: fk, ref: books, type: integer}
          - {names: [language, target_language], type: text, role: category, values: [Spanish, German, French, Japanese, Italian, Portuguese, Korean, Mandarin]}
          - {names: [sold_on, sale_date], type: date, role: date, min: "2010-01-01", max: "2025-12-31"}
          - {names: [rights_fee, advance_paid], type: real, role: number, min: 500, max: 400000}
          - {names: [term_years, license_years], type: integer, role: number, min: 3, max: 10, optional: true}

      - key: book_reviews
        names: [book_reviews, reviews]
        id: [book_review_id, review_id]
        columns:
          - {role: fk, ref: books, type: integer}
          - {names: [review_date, published_on], type: date, role: date, min: "2005-01-01", max: "2025-12-31"}
          - {names: [rating, stars], type: integer, role: number, min: 1, max: 5}
          - {names: [outlet_type, publication_type], type: text, role: category, values: [newspaper, trade magazine, literary journal, blog, podcast]}
          - {names: [is_starred, starred_review], type: integer, role: flag, optional: true}

      - key: print_runs
        names: [print_runs, printings]
        id: [print_run_id, printing_id]
        columns:
          - {role: fk, ref: editions, type: integer}
          - {names: [print_date, printed_on], type: date, role: date, min: "2005-01-01", max: "2025-12-31"}
          - {names: [copies_printed, quantity], type: integer, role: number, min: 500, max: 500000}
          - {names: [unit_cost, cost_per_copy], type: real, role: number, min: 0.8, max: 9}
          - {names: [printer_country, print_location], type: text, role: category, values: [United States, Canada, United Kingdom, China, Italy, Poland]}
