          - {names: [acres_planted, planted_acres], type: real, role: number, min: 5, max: 640}
          - {names: [seeds_per_acre, seed_rate], type: integer, role: number, min: 25000, max: 200000}
          - {names: [seed_cost, seed_cost_usd], type: real, role: number, min: 500, max: 90000, optional: true}

      - key: harvests
        names: [harvests, harvest_records]
        id: [harvest_id, record_id]
        columns:
          - {role: fk, ref: fields, type: integer}
          - {role: fk, ref: crops, type: integer}
          - {names: [harvested_date, completed_date], type: date, role: date, min: "2015-07-01", max: "2025-12-15"}
          - {names: [yield_per_acre, yield_bu_per_acre], type: real, role: number, min: 20, max: 250}
          - {names: [moisture_pct, grain_moisture_pct], type: real, role: number, min: 10, max: 30}
          - {names: [test_weight_lb, bushel_weight_lb], type: real, role: number, min: 48, max: 62, optional: true}

      - key: workers
        names: [farm_workers, farmhands]
        id: [worker_id, farmhand_id]
        columns:
          - {role: fk, ref: farms, type: integer}
          - {names: [first_name], type: text, role: first_name}
          - {names: [last_name], type: text, role: last_name}
          - {names: [job_role, duties], type: text, role: category, values: [equipment operator, irrigation technician, field hand, crop scout, farm manager]}
          - {names: [hire_date, start_date], type: date, role: date, min: "2005-01-01", max: "2025-12-31"}
          - {names: [hourly_wage, pay_rate], type: real, role: number, min: 12, max: 40}
          - {names: [seasonal, is_seasonal], type: integer, role: flag, optional: true}

      - key: machinery
        names: [machinery, farm_equipment]
        id: [machine_id, equipment_id]
        columns:
          - {role: fk, ref: farms, type: integer}
          - {names: [unit_type, asset_type], type: text, role: category, values: [tractor, combine, planter, sprayer, grain cart, baler]}
          - {names: [make, manufacturer], type: text, role: category, values: [John Deere, Case IH, New Holland, Kubota, Fendt, Claas]}
          - {names: [purchase_date, acquired_date], type: date, role: date, min: "2000-01-01", max: "2025-12-31"}
          - {names: [purchase_price, price_usd], type: real, role: number, min: 15000, max: 900000}
          - {names: [engine_hours, hours_logged], type: integer, role: number, min: 0, max: 20000, optional: true}

      - key: soil_tests
        names: [soil_tests, soil_samples]
        id: [test_id, sample_id]
        columns:
          - {role: fk, ref: fields, type: integer}
          - {names: [sampled_date, collected_date], type: date, role: date, min: "2015-01-01", max: "2025-12-31"}
          - {names: [ph, soil_ph], type: real, role: number, min: 4.5, max: 8.5}
          - {names: [nitrate_ppm, nitrate_n_ppm], type: real, role: number, min: 2, max: 60}
          - {names: [phosphorus_ppm, olsen_p_ppm], type: real, role: number, min: 5, max: 120, optional: true}
          - {names: [organic_matter_pct, som_pct], type: real, role: number, min: 0.5, max: 8}

      - key: applications
        names: [field_applications, input_applications]
        id: [application_id, application_id]
        columns:
          - {role: fk, ref: fields, type: integer}
          - {names: [applied_date, application_date], type: date, role: date, min: "2015-03-01", max: "2025-11-30"}
          - {names: [product_type, input_type], type: text, role: category, values: [nitrogen fertilizer, phosphate fertilizer, herbicide, fungicide, insecticide, lime, manure]}
          - {names: [acres_treated, treated_acres], type: real, role: number, min: 5, max: 640}
          - {names: [cost, total_cost], type: real, role: number, min: 200, max: 90000}

      - key: crop_sales
        names: [crop_sales, grain_sales]
        id: [sale_id, sale_id]
        columns:
          - {role: fk, ref: farms, type: integer}
          - {role: fk, ref: crops, type: integer}
          - {names: [sale_date, sold_date], type: date, role: date, min: "2015-08-01", max: "2025-12-31"}
          - {names: [quantity_bushels, bushels_sold], type: real, role: number, min: 500, max: 200000}
          - {names: [price_per_bushel, unit_price], type: real, role: number, min: 2.5, max: 15}
          - {names: [buyer_type, buyer], type: text, role: category, values: [grain elevator, ethanol plant, export terminal, feedlot, food processor]}

